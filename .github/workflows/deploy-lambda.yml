# .github/workflows/deploy-lambda.yml
name: Build and Deploy Lambda

on:
  push:
    branches: [main]

jobs:
  build-zip-upload:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: s3storagestack-lambdaartifactsbucket8bca8cc4-lavcwanqsmci # Change if recreated
      REGION: us-east-1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Remove dev dependencies
        run: rm -rf node_modules

      - name: Install production dependencies
        run: yarn install --production

      - name: Run prisma generate
        run: npx prisma generate

      - name: Prepare dist-lambda folder
        run: yarn prepare-lambda

      - name: Zip Lambda package
        run: yarn zip-lambda

      - name: Upload to S3
        run: |
          VERSION_ID=backend-lambda-v$(date +%s).zip
          aws s3 cp ./dist-lambda/lambda-package.zip s3://$BUCKET_NAME/$VERSION_ID
          echo "VERSION_ID=$VERSION_ID" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.REGION }}

      - name: Trigger CDK deploy in climetria-infra
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: your-org/climetria-infra
          event-type: lambda-artifact-updated
          client-payload: '{"lambdaVersion": "${{ env.VERSION_ID }}"}'
